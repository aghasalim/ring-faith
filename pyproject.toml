[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ringfaith"
version = "0.1.0"
description = "Node-level detection, ring recovery and explanation faithfulness are not the same thing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "pandas>=2.0", "tabulate>=0.9", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
