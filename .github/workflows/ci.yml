name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Test
        run: pytest tests/ -q
      - name: Smoke-test the experiment path
        run: |
          python experiments/run_sweep.py --seeds 1 --n-explain 3 \
            --topologies clique star --camouflage 0.0 1.0 --out /tmp/ci-reports
          python experiments/degenerate_split_demo.py
